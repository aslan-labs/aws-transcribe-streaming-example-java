<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AWS Transcribe Web Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #transcript {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="container mt-5">
    <h1>AWS Transcribe Web Demo</h1>
    
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="mb-3">
                <label for="languageCode" class="form-label">Dil:</label>
                <select id="languageCode" class="form-select">
                    <option value="en-US">English (en-US)</option>
                    <option value="tr-TR">Türkçe (tr-TR)</option>
                </select>
            </div>
            <button id="startMic" class="btn btn-primary w-100 mb-2">Mikrofon Başlat</button>
            <button id="stopMic" class="btn btn-danger w-100 mb-4" disabled>Durdur</button>
            
            <div class="mb-3">
                <label class="form-label">Ses Seviyesi (VAD):</label>
                <div class="progress">
                    <div id="vadProgress" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <hr>
            
            <div class="mb-3">
                <label for="audioFile" class="form-label">Ses Dosyası Yükle:</label>
                <input type="file" id="audioFile" class="form-control" accept="audio/*">
            </div>
            <button id="uploadFile" class="btn btn-success w-100">Dosya Transkribe Et</button>
        </div>
        
        <div class="col-md-8">
            <h4>Transkript</h4>
            <div id="transcript"></div>
            <button id="clearTranscript" class="btn btn-secondary mt-2">Temizle</button>
        </div>
    </div>

    <script>
        const transcriptDiv = document.getElementById('transcript');
        const startMicBtn = document.getElementById('startMic');
        const stopMicBtn = document.getElementById('stopMic');
        const vadProgress = document.getElementById('vadProgress');
        const languageCodeSelect = document.getElementById('languageCode');
        const audioFileInput = document.getElementById('audioFile');
        const uploadFileBtn = document.getElementById('uploadFile');
        const clearBtn = document.getElementById('clearTranscript');

        let eventSource = null;

        function appendTranscript(text) {
            transcriptDiv.innerText += text + " ";
            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }

        function setStatus(text) {
            transcriptDiv.innerText += "\n[" + text + "]\n";
            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }

        startMicBtn.onclick = () => {
            const lang = languageCodeSelect.value;
            fetch('/api/transcribe/start-mic?language=' + lang, { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        startMicBtn.disabled = true;
                        stopMicBtn.disabled = false;
                        setStatus("Mikrofon başlatıldı...");
                        
                        // SSE bağlantısını başlat
                        if (eventSource) eventSource.close();
                        eventSource = new EventSource('/api/transcribe/events');
                        eventSource.onmessage = (event) => {
                            const data = event.data;
                            if (data.startsWith("VAD:")) {
                                const level = parseFloat(data.substring(4)) * 100;
                                vadProgress.style.width = level + "%";
                                vadProgress.setAttribute("aria-valuenow", level);
                                if (level > 20) {
                                    vadProgress.classList.add("bg-success");
                                } else {
                                    vadProgress.classList.remove("bg-success");
                                }
                            } else if (data.startsWith("TEXT:")) {
                                appendTranscript(data.substring(5));
                            } else {
                                appendTranscript(data);
                            }
                        };
                        eventSource.onerror = () => {
                            console.error("SSE Connection failed.");
                            eventSource.close();
                        };
                    }
                });
        };

        stopMicBtn.onclick = () => {
            fetch('/api/transcribe/stop-mic', { method: 'POST' })
                .then(() => {
                    startMicBtn.disabled = false;
                    stopMicBtn.disabled = true;
                    vadProgress.style.width = "0%";
                    setStatus("Durduruldu.");
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                });
        };

        uploadFileBtn.onclick = () => {
            const file = audioFileInput.files[0];
            if (!file) return alert("Lütfen bir dosya seçin.");

            const formData = new FormData();
            formData.append("file", file);
            formData.append("language", languageCodeSelect.value);

            setStatus("Dosya yükleniyor ve işleniyor...");
            uploadFileBtn.disabled = true;

            fetch('/api/transcribe/file', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(text => {
                setStatus("Dosya Transkripti Tamamlandı:");
                appendTranscript("\n" + text + "\n");
                uploadFileBtn.disabled = false;
            })
            .catch(err => {
                setStatus("Hata: " + err);
                uploadFileBtn.disabled = false;
            });
        };

        clearBtn.onclick = () => {
            transcriptDiv.innerText = "";
        };
    </script>
</body>
</html>
